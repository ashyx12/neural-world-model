[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-world-model"
version = "0.1.0"
description = "Action-conditioned neural world model for visual MiniGrid environments"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29",
  "minigrid>=2.3",
  "numpy>=1.24",
  "torch>=2.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
